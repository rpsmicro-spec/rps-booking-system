name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy-migrations:
    name: Deploy Migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "❌ Error: SUPABASE_PROJECT_REF secret is not set"
            echo "Please add SUPABASE_PROJECT_REF to your GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "❌ Error: SUPABASE_ACCESS_TOKEN secret is not set"
            echo "Please add SUPABASE_ACCESS_TOKEN to your GitHub repository secrets"
            exit 1
          fi
          echo "✅ Required secrets are configured"

      - name: Link to Supabase project
        run: |
          echo "Linking to Supabase project: ${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to Supabase
        run: |
          echo "Pushing migrations to Supabase..."
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Migration Summary
        run: |
          echo "✅ Migrations deployed successfully!"
          echo "Project: ${{ secrets.SUPABASE_PROJECT_REF }}"
        if: success()
