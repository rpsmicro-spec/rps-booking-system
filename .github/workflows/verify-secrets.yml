name: Verify secrets (temporary)
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_3mvLX3MSFUpVOxOEazLAz5mU
      VERCEL_PROJECT_ID: prj_oN1kn0uI2ktoAIZbydJuEI7cSTEQ
    steps:
      - uses: actions/checkout@v7
      - name: Vercel token reaches the project
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "Vercel project API: $code"; test "$code" = 200
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0
      - name: Supabase token links and lists migrations (read-only)
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --remote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
