version: 2
updates:
  # npm packages: security PRs open immediately; version updates arrive
  # monthly with all patch/minor bumps grouped into a single PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Kolkata"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-fixes:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    # ESLint 10 breaks lint: eslint-plugin-import 2.32 and
    # eslint-plugin-jsx-a11y 6.10 (pulled in by eslint-config-next) only
    # declare peers up to ESLint 9 (#65). Drop this once they support 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Keep GitHub Actions used in workflows up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
